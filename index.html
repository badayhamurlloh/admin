<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profil Pembayaran</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap');

        body { 
            font-family: 'Poppins', sans-serif; 
            /* Background gradasi lebih elegan */
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%); 
            margin: 0; 
            padding: 20px; 
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container { 
            max-width: 450px; 
            width: 100%;
            background: #ffffff; 
            padding: 30px; 
            border-radius: 30px; 
            box-shadow: 0 20px 40px rgba(0,0,0,0.2); 
            text-align: center;
        }

        .hero-img { 
            width: 160px; 
            height: 160px; 
            border-radius: 25px; 
            object-fit: cover; 
            border: 5px solid #fff; 
            box-shadow: 0 10px 20px rgba(0,0,0,0.1); 
            margin-bottom: 15px;
        }

        .hero-name { font-size: 26px; font-weight: 600; color: #333; margin: 0; }
        .hero-location { font-size: 14px; color: #7f8c8d; margin-bottom: 20px; }

        .card { 
            background: #fdfdfd; 
            border: 1px solid #eee; 
            padding: 18px; 
            margin: 12px 0; 
            border-radius: 18px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
        }

        /* Tombol Bayar (Link WhatsApp) */
        .pay-btn { 
            background: #27ae60; 
            color: white; 
            padding: 8px 15px; 
            border-radius: 12px; 
            font-size: 12px; 
            font-weight: 600; 
            text-decoration: none; 
            transition: 0.3s;
            display: inline-block;
        }
        .pay-btn:hover { background: #219150; transform: scale(1.05); }

    </style>
</head>
<body>

    <div class="container">
        <div class="hero-section">
            <img src="https://i.ibb.co/TD2WHPH1/Screenshot-2026-06-09-15-06-22-108-com-google-android-apps-photos.jpg" alt="Farhan A." class="hero-img">
            <h1 class="hero-name">Farhan A.</h1>
            <div class="hero-location">📍 Kab. Jabar, Indramayu</div>
        </div>

        <div class="list-section">
            <div class="card">
                <span class="item-name">Isian epep</span>
                <a href="https://wa.me/628131431367?text=Halo, saya ingin membayar isian epep" class="pay-btn">BAYAR</a>
            </div>

            <div class="card">
                <span class="item-name">epep</span>
                <a href="https://wa.me/628131431367?text=Halo, saya ingin membayar isian epep" class="pay-btn">BAYAR</a>
            </div>
        </div>
    </div>

</body>
</html>
