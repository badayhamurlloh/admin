<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar Tunggakan</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap');

        body { 
            font-family: 'Poppins', sans-serif; 
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%); 
            margin: 0; 
            padding: 20px; 
            min-height: 100vh;
        }
        .container { 
            max-width: 500px; 
            margin: auto; 
            background: #ffffff; 
            padding: 30px; 
            border-radius: 20px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.1); 
        }
        h1 { 
            color: #2d3436; 
            text-align: center; 
            font-size: 22px; 
            margin-bottom: 25px; 
        }
        .person-card { 
            background: #fff; 
            border: 1px solid #dfe6e9; 
            padding: 15px; 
            margin: 15px 0; 
            border-radius: 12px; 
            display: flex; 
            align-items: center; 
            transition: transform 0.2s;
        }
        .person-card:hover { transform: translateY(-5px); }
        .profile-img { 
            width: 70px; 
            height: 70px; 
            border-radius: 50%; 
            object-fit: cover; 
            margin-right: 20px; 
            border: 3px solid #ff7675;
        }
        .info h3 { margin: 0; color: #2d3436; font-size: 16px; }
        .info p { margin: 5px 0; color: #636e72; font-size: 13px; }
        .badge { 
            background: #ff7675; 
            color: white; 
            padding: 3px 10px; 
            border-radius: 20px; 
            font-size: 11px; 
            font-weight: 600; 
            display: inline-block;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Daftar Belum Bayar</h1>

        <div class="person-card">
            <img src="https://i.ibb.co/3m20f6tG/20hZjcjS.jpg" alt="Foto Profil" class="profile-img">
            <div class="info">
                <h3>Nama Orang</h3>
                <p>Keterangan: Tagihan Belum Lunas</p>
                <span class="badge">BELUM BAYAR</span>
            </div>
        </div>
        
        </div>

</body>
</html>
